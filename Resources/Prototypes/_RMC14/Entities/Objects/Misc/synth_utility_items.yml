- type: entity
  parent: BaseStorageItem
  id: RMCSynthRepairKit
  name: synthetic repair kit
  description: A compact kit of field tools and replacement cabling for synthetic structural repairs.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/engineer_kit.rsi
    layers:
    - state: toolkit
    - state: toolkit_empty
      map: [ "openLayer" ]
      visible: false
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,11,1
    whitelist:
      tags:
      - Crowbar
      - Screwdriver
      - Wirecutter
      - Wrench
      - CableCoil
      - Multitool
      - PowerCell
      components:
      - Welder
      - PowerCell
      - TrayScanner
  - type: FixedItemSizeStorage
  - type: Item
    size: Normal
  - type: GenericVisualizer
    visuals:
      enum.SharedBagOpenVisuals.BagState:
        openLayer:
          Open: { visible: true }
          Closed: { visible: false }
  - type: Appearance

- type: entity
  parent: RMCSynthRepairKit
  id: RMCSynthRepairKitFilled
  suffix: Filled
  components:
  - type: StorageFill
    contents:
    - id: CMWelder
    - id: RMCCableCoil30
    - id: CMWirecutter
    - id: CMMultitool

- type: entity
  parent: RMCSynthRepairKit
  id: RMCSynthRepairKitEliteFilled
  name: elite synthetic repair kit
  suffix: Filled
  components:
  - type: StorageFill
    contents:
    - id: RMCWelderIndustrialHighCapacity
    - id: RMCCableCoil30
      amount: 2
    - id: CMWirecutter
    - id: CMMultitool
    - id: CMTRayScanner

- type: entity
  parent: BaseItem
  id: RMCSynthExperimentalToolsToken
  name: synthetic experimental tools token
  description: A Weston-Yamada token authorized for one synthetic support unit to draw from the experimental tools cache.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/synth_token.rsi
    state: coin_synth
  - type: Item
    size: Tiny
  - type: RMCVendorPointsToken
    pointsType: ExperimentalTools
    points: 45
